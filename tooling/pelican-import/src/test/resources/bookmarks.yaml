openapi: 3.1.0
info:
  title: Bookmarks
  version: "2.1.0"
  description: A small document, written by hand, to import.
servers:
  - url: https://bookmarks.example.com/{stage}
    variables:
      stage:
        default: v1
security:
  - apiKey: []
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: The key you were issued.
  schemas:
    Bookmark:
      type: object
      required: [id, url, tags]
      properties:
        id:
          type: integer
          format: int64
        url:
          type: string
        title:
          type: [string, "null"]
        tags:
          type: array
          items:
            type: string
        kind:
          type: string
          enum: [link, note, in-progress]
    CreateBookmark:
      type: object
      required: [url]
      properties:
        url:
          type: string
        title:
          type: string
    Problem:
      type: object
      required: [status, detail]
      properties:
        status:
          type: integer
          format: int32
        detail:
          type: string
paths:
  /bookmarks:
    get:
      operationId: listBookmarks
      summary: List bookmarks
      tags: [bookmarks]
      parameters:
        - name: limit
          in: query
          required: false
          description: How many to return
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - name: tag
          in: query
          required: false
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: The page you asked for
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bookmark'
    post:
      operationId: createBookmark
      summary: Create a bookmark
      tags: [bookmarks]
      requestBody:
        description: The bookmark to create
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookmark'
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: Where the new bookmark lives
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bookmark'
        "429":
          description: Slow down
          headers:
            Retry-After:
              schema:
                type: integer
                format: int32
  /bookmarks/{bookmarkId}:
    parameters:
      - name: bookmarkId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: getBookmark
      summary: Fetch one bookmark
      description: |
        Reads a single bookmark.

        The id is the one the create call handed back.
      tags: [bookmarks]
      responses:
        "200":
          description: Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bookmark'
        "404":
          description: No bookmark with that id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      operationId: deleteBookmark
      summary: Delete a bookmark
      security: []
      tags: [bookmarks]
      responses:
        "204":
          description: Gone
