name: publish

on:
  push:
    # A pre-release tag is not a release: a candidate is a snapshot, which
    # snapshot.yml publishes, rather than a version on Central for good.
    tags: ["v*", "!v*-*"]
  # A tag push publishes everything, which is the release. A dispatch does one
  # of two things. With `version`, it cuts that release: it tags `ref` (a commit
  # on main, main's head by default) as v<version>, publishes, and pushes the
  # tag once Central has the release, so nobody has to push a tag from a laptop.
  # A tag pushed with the workflow's own token would not start another workflow,
  # which is why the tagging is here. Without `version`, `ref` names a tag
  # already pushed, for a registry that was skipped at the time — the Plugin
  # Portal step below skips itself when no key is configured — and has to be
  # caught up afterwards, without re-uploading to a registry that has it.
  workflow_dispatch:
    inputs:
      version:
        description: "Release to cut, e.g. 2.0.1: tags `ref` as v<version>. Empty: publish the tag `ref` names."
        type: string
        default: ""
      ref:
        description: "With a version, the commit on main to tag (empty: main's head). Without, the tag to publish (empty: the dispatched ref)."
        type: string
        default: ""
      targets:
        description: "Which registries to publish to."
        type: choice
        options: [both, central, portal]
        default: both

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    # To push the tag a `version` dispatch creates, once Central has the
    # release. Nothing else here writes to the repository.
    permissions:
      contents: write

    # Job-level rather than per-step: the credentials are the same for every
    # step that needs any of them, and a step's `if:` can read `env` — where it
    # cannot read `secrets`, which is what the Plugin Portal step below turns on.
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
      GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
      GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

    steps:
      # The build below runs every test, Gannet's included, and Gannet's io_uring rings are charged to
      # RLIMIT_MEMLOCK: 8 MiB for every process of the runner's user, fewer carriers' rings than
      # pelican-gannet-docs holds open. Raised on the runner's worker, as build.yml does, so the Gradle daemon
      # inherits it; v2.0.0's first publish failed here with io_uring_setup's ENOMEM before uploading anything.
      - name: Room under RLIMIT_MEMLOCK for Gannet's rings
        run: sudo prlimit --pid "$(pgrep -f Runner.Worker | head -n 1)" --memlock=unlimited:unlimited

      - uses: actions/checkout@v7
        with:
          # A dispatch runs the workflow file from the ref it was dispatched on,
          # so catching up an old release means dispatching on `main` — for this
          # file — and naming the tag here, for the source and the version.
          ref: ${{ inputs.ref || (inputs.version != '' && 'main') || github.ref }}
          # The version is derived from the nearest `v` tag, and a shallow
          # checkout has no tags to derive it from.
          fetch-depth: 0

      # Local first, so both builds read the release version for the tests and
      # the uploads; pushed after the Central steps, so a failed build leaves
      # no tag behind. A tag that already exists on the same commit is a re-run
      # and is reused; on another commit it is refused.
      - name: Tag the release
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in
            *[!0-9.]*|.*|*.|*..*) echo "$VERSION is not a release version (X.Y.Z)"; exit 1 ;;
          esac
          [ "$(echo "$VERSION" | tr -cd . | wc -c)" = 2 ] || { echo "$VERSION is not X.Y.Z"; exit 1; }
          commit=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$commit" origin/main || { echo "$commit is not on main"; exit 1; }
          tag="v$VERSION"
          if existing=$(git rev-parse -q --verify "refs/tags/$tag^{commit}"); then
            [ "$existing" = "$commit" ] || { echo "$tag already tags $existing, not $commit"; exit 1; }
            echo "$tag already tags $commit"
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                tag -a "$tag" "$commit" -m "pelican $VERSION"
            echo "tagged $commit as $tag"
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      # The version comes from the nearest `v` tag, so a dispatch that names a
      # branch rather than a tag would build a snapshot — which the Plugin
      # Portal refuses and Central should not be asked for. Fail here, before
      # either upload rather than between them.
      #
      # A candidate is refused for the same reason: it is a snapshot's job, and
      # a version on Central is permanent and counts against the Portal's
      # monthly limits.
      - name: Refuse anything but a release
        run: |
          # The project's version rather than axion's `currentVersion`, which in
          # this subdirectory build answers the last tag that touched tooling/.
          version=$(./gradlew -p tooling/pelican-gradle-plugin -q properties \
            | sed -n 's/^version: //p')
          echo "version: $version"
          case "$version" in
            "") echo "could not read the version"; exit 1 ;;
            *-SNAPSHOT) echo "refusing to publish a snapshot"; exit 1 ;;
            *-*) echo "$version is not a release; snapshot.yml publishes candidates"; exit 1 ;;
          esac
          if [ -n "$ASKED" ] && [ "$version" != "$ASKED" ]; then
            echo "asked to release $ASKED, but the build reads $version"; exit 1
          fi
        env:
          ASKED: ${{ inputs.version }}

      # SignInTest drives Chromium. Fetched here, and cached by the build file that pins Playwright's version,
      # rather than by the test under its five-minute timeout, where a slow mirror failed unrelated builds.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('integrations/pelican-oidc/build.gradle.kts') }}

      - name: Chromium for SignInTest
        run: ./gradlew :pelican-oidc:installChromium --stacktrace

      # The same gate a pull request goes through. A release that cannot build
      # is worth finding out about before it is on Maven Central for good,
      # which is why this runs the tests rather than skipping them.
      - name: Build and test
        run: ./gradlew build --stacktrace

      # Uploads a bundle to the Central Portal and leaves it staged. Releasing
      # it is a click there: a staged bundle can be dropped, a released one is
      # permanent. Set `mavenCentralAutomaticPublishing` to skip the click.
      #
      # One namespace per upload: the Portal refuses a deployment with files
      # for two, and a Gradle run uploads one, so `centralNamespace` picks which
      # publications a run sends. dev.surefold is the default; the relocation
      # POMs and the old plugin ID's marker at io.github.matthewjones372
      # (spec 0107) go in runs of their own.
      - name: Publish the modules to Maven Central
        if: inputs.targets != 'portal'
        run: ./gradlew publishToMavenCentral --no-configuration-cache

      - name: Publish the modules' relocation POMs to Maven Central
        if: inputs.targets != 'portal'
        run: >
          ./gradlew publishToMavenCentral --no-configuration-cache
          -PcentralNamespace=io.github.matthewjones372

      # The Gradle plugin is a build of its own, so the root build's publish
      # tasks do not reach it.
      - name: Publish the Gradle plugin to Maven Central
        if: inputs.targets != 'portal'
        run: >
          ./gradlew -p tooling/pelican-gradle-plugin publishToMavenCentral
          --no-configuration-cache

      - name: Publish the Gradle plugin's relocation POM and old ID to Maven Central
        if: inputs.targets != 'portal'
        run: >
          ./gradlew -p tooling/pelican-gradle-plugin publishToMavenCentral
          --no-configuration-cache -PcentralNamespace=io.github.matthewjones372

      # After Central has every deployment and before the Plugin Portal, which
      # can fail or wait on approval on its own: the tag records what Central
      # has. A dispatch without a version ran on a tag that is already pushed.
      - name: Push the tag
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: git push origin "refs/tags/v$VERSION"

      # The Plugin Portal is where `plugins { id(...) }` resolves from without
      # a `pluginManagement` block. It needs an account the library release
      # does not, so a missing key skips this rather than failing the release
      # that already reached Central.
      - name: Publish the Gradle plugin to the Gradle Plugin Portal
        if: env.GRADLE_PUBLISH_KEY != '' && inputs.targets != 'central'
        run: >
          ./gradlew -p tooling/pelican-gradle-plugin publishPlugins
          --no-configuration-cache
