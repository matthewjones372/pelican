# An included build does not inherit the root build's gradle.properties, so the
# publishing switch is repeated here. The version is not: the build script reads
# it out of ../gradle.properties, because a second copy of a number that has to
# match is a second thing to forget. A switch that is simply `true` in both
# places has nothing to drift.
mavenCentralPublishing=true
signAllPublications=true
