# The daemon holds the Kotlin compiler frontend for as long as a build runs.
# `jvmToolchain(21)` means that on a JDK 21 daemon the compilation the other
# JDKs fork into a JVM of their own stays in this one, and `detektMain` and
# `detektTest` resolve types against every module's compile classpath on top of
# that. 512m of metaspace did not hold it: the daemon died mid-build on CI's
# Java 21 job and only there, taking the tasks in flight with it and reporting
# them as failures of their own.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=1g
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official

# Publishing goes to the Central Portal, which is the only way in since OSSRH
# closed. The uploaded bundle is left staged rather than released: a staged
# bundle can be dropped, a released one is on Maven Central for good. Set
# mavenCentralAutomaticPublishing=true to release without the click.
mavenCentralPublishing=true

# Signing is required for a release version and skipped for a -SNAPSHOT, which
# is what an untagged commit builds as — so a contributor with no key can still
# run `publishToMavenLocal`, and a tagged build cannot go out unsigned.
signAllPublications=true
