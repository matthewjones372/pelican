org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official

# The version every module publishes at. Add -SNAPSHOT back while a release is
# in flight; the Central Portal takes a snapshot and a release at the same
# coordinate, and only the release is permanent.
pelicanVersion=0.1.0

# Publishing goes to the Central Portal, which is the only way in since OSSRH
# closed. The uploaded bundle is left staged rather than released: a staged
# bundle can be dropped, a released one is on Maven Central for good. Set
# mavenCentralAutomaticPublishing=true to release without the click.
mavenCentralPublishing=true
